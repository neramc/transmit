name: build and test

# Windows and macOS are built here because they cannot be built anywhere else
# the project is developed. Every fault this matrix has found so far has been a
# real one - a folder table assembled from two different homes, Objective-C++
# compiled without the reference counting it was written for, shared buffers
# read from more than one worker at a time - so it is worth keeping honest.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtimageformats'
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev liblzma-dev libssl-dev \
                                  libsqlite3-dev libsecret-1-dev \
                                  libgl1-mesa-dev libxkbcommon-x11-0 xvfb \
                                  gnome-keyring libsecret-tools dbus-x11

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja zstd xz openssl@3 sqlite

      # Qt is installed for msvc2022_64 and vcpkg builds x64-windows, both of
      # which are MSVC-ABI. Without this the Ninja generator picks up whatever
      # g++ happens to be on PATH and produces objects that cannot link
      # against either of them.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install zlib:x64-windows zstd:x64-windows liblzma:x64-windows `
                        openssl:x64-windows sqlite3:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Configure
        run: cmake --preset default -DTRANSMIT_WERROR=ON

      - name: Build
        run: cmake --build --preset default

      - name: Test
        shell: bash
        run: |
          # A second, louder pass over whatever failed. ctest buffers a test's
          # output and loses it if the process dies rather than reporting, and
          # a failure nobody can read costs another full run to diagnose.
          ctest --preset default || {
              echo "::group::Re-running the failures verbosely"
              ctest --test-dir build --rerun-failed --output-on-failure --verbose || true
              echo "::endgroup::"

              # ctest relays what a test wrote to stdout, and on Windows that
              # has come back empty even under --verbose. QtTest can write its
              # own report to a file instead, which nothing in between can
              # swallow.
              echo "::group::Reports written straight to a file"
              for suite in UiSmoke RestoreUndo ContinuityRoundTrip PathRewrite SecretStore; do
                  for binary in "build/tests/ui/transmit_${suite}_test" \
                                "build/tests/integration/transmit_${suite}_test" \
                                "build/transmit_${suite}_test"; do
                      for candidate in "$binary" "$binary.exe"; do
                          [ -x "$candidate" ] || continue
                          report="$suite-report.txt"
                          QT_QPA_PLATFORM=offscreen "$candidate" -o "$report,txt" \
                              >/dev/null 2>&1 || true
                          if [ -s "$report" ]; then
                              echo "----- $suite -----"
                              cat "$report"
                          fi
                          break 2
                      done
                  done
              done
              echo "::endgroup::"
              exit 1
          }

      # The credential tests skip themselves when there is no secret service,
      # which on a build machine means they would always skip. Giving them a
      # throwaway keyring is what makes them worth having.
      - name: Test against a real keyring
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          dbus-run-session -- scripts/with-keyring.sh \
              ./build/tests/integration/transmit_SecretStore_test | tee keyring.log

          # The suite skips itself when there is no secret service, which is
          # the right behaviour on a developer's machine and useless here: a
          # step that always skips reports success and proves nothing.
          if grep -q "SKIP   : SecretStoreTest::initTestCase" keyring.log; then
              echo "::error::the credential tests skipped - no keyring was reachable"
              exit 1
          fi

      # The interface has to start, not merely link. This catches a QML module
      # that failed to register, which no unit test would notice.
      - name: Check the interface starts
        if: runner.os == 'Linux'
        run: |
          export QT_QPA_PLATFORM=offscreen

          # A window with nobody to close it should still be running when the
          # timeout fires, and `timeout` says so with 124. Grepping the output
          # is not enough on its own: an interface that dies for a reason
          # nobody has seen before prints something else and would pass.
          set +e
          timeout 20 ./build/transmit > started.log 2>&1
          status=$?
          set -e

          cat started.log
          if [ "$status" -ne 124 ]; then
            echo "::error::the interface exited on its own (status $status)"
            exit 1
          fi
          if grep -qE "is not a type|failed to load|not installed" started.log; then
            echo "::error::the interface started with QML errors"
            exit 1
          fi

      - name: Round trip through the command line
        shell: bash
        run: |
          set -e

          # Asked for rather than assumed. Pointing HOME at a sample directory
          # works on Linux and macOS and does nothing at all on Windows, which
          # resolves its known folders through the shell - so the file went one
          # place and the capture looked in another.
          documents=$(./build/transmit-cli environment \
                      | awk -F'} ' '/^  \{DOCUMENTS/ {print $2}')
          if [ -z "$documents" ]; then
              echo "::error::transmit-cli could not say where documents are kept"
              exit 1
          fi
          echo "documents folder: $documents"

          mkdir -p "$documents"
          echo "hello" > "$documents/transmit-ci-note.txt"
          printf 'passphrase-for-ci\n' > pw.txt

          ./build/transmit-cli export \
              --out "$PWD/archive.txa" --profile documents --preset fast \
              --passphrase-file pw.txt
          ./build/transmit-cli verify "$PWD/archive.txa" --passphrase-file pw.txt
          ./build/transmit-cli import "$PWD/archive.txa" --into "$PWD/restored" \
              --passphrase-file pw.txt
          diff "$documents/transmit-ci-note.txt" restored/DOCUMENTS/transmit-ci-note.txt

          # The cross-platform translation is the point of the project, so it is
          # exercised on every runner rather than only where it is native.
          for target in windows macos linux; do
            ./build/transmit-cli import "$PWD/archive.txa" --emulate-os "$target" \
                --dry-run --passphrase-file pw.txt
          done

  quality:
    name: Formatting and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy-18 clang-format-18 \
                                  libzstd-dev liblzma-dev libssl-dev libsqlite3-dev \
                                  libsecret-1-dev libgl1-mesa-dev

      - name: Check formatting
        run: scripts/format.sh --check

      - name: Check every QML file is registered
        run: scripts/check-qml-modules.sh

      # docs/design.md is the source of truth for the interface, and neither of
      # these can be enforced by review: a hard-coded 13 in one page looks like
      # nothing, and a colour pair that is a shade too close is invisible to
      # anyone who is not measuring it.
      - name: Check the design tokens are used
        run: scripts/check-design-tokens.sh

      - name: Check the palette is readable
        run: python3 scripts/check-contrast.py

      # The full build rather than cli-only: clang-tidy reads a compile
      # database, and the application layer is only in one when the interface
      # is built. That layer holds the controllers, which is where the
      # threading is.
      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      - name: Static analysis
        run: |
          # Everything this machine can compile. Windows and macOS sources are
          # not in a Linux compile database at all, so they are excluded here
          # and covered by the three-platform build job instead.
          files=$(git ls-files src/ | grep -E '\.cpp$' | grep -vE '^src/platform/(windows|macos)/')
          count=$(printf '%s\n' "$files" | wc -l)
          echo "analysing $count files"

          # A pathspec that stops matching is silent - the step would pass
          # having analysed nothing at all. This is the tripwire for that.
          if [ "$count" -lt 50 ]; then
              echo "::error::only $count files matched; the file list has stopped working"
              exit 1
          fi

          run-clang-tidy-18 -p build -j "$(nproc)" -quiet $files

  # The sanitisers the asan preset was written for and CI never ran.
  #
  # Address and undefined behaviour over everything.
  #
  # Thread over the suites that link no Qt. That is not squeamishness: a
  # sanitiser cannot see synchronisation performed inside an
  # uninstrumented library, and Qt here is a distribution build. Run
  # against the integration suites it reports races in Qt's own
  # containers - two compression workers reallocating a QArrayData
  # inside QtConcurrent - which are neither ours nor real, and it says
  # nothing whatever about our code. Suppressing them would hide the
  # reports worth having.
  #
  # The concurrency that actually touches user data is
  # ArchiveWriter::prepare being called from many workers at once, and
  # ContainerTest::PreparesBlocksFromManyThreadsAtOnce exercises exactly
  # that with plain std::thread, where every frame is instrumented and a
  # report would be real.
  sanitizers:
    name: Sanitisers (${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: asan-ubsan
            preset: asan
            ctest: --preset asan
          - kind: tsan
            preset: tsan
            ctest: --test-dir build-tsan -L 'format|property|fault'

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtimageformats'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev liblzma-dev libssl-dev \
                                  libsqlite3-dev libsecret-1-dev \
                                  libgl1-mesa-dev libxkbcommon-x11-0

      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env:
          # Qt and the QML engine hold allocations at exit by design, so
          # the suppressions are narrow. detect_leaks=0 would be the easy
          # way out and would also switch off the thing worth having.
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1:check_initialization_order=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          QT_QPA_PLATFORM: offscreen
        run: ctest ${{ matrix.ctest }} --output-on-failure

  # The catalog is the only part of Transmit whose content is data rather than
  # code, and the only part a user can extend without building anything. Both
  # of those mean it has to be checked as data.
  catalog:
    name: Application catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet jsonschema
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev liblzma-dev libssl-dev libsqlite3-dev

      - name: Check it against the schema
        run: |
          python3 - <<'PYTHON'
          import json
          import jsonschema

          schema = json.load(open("resources/app-catalog.schema.json"))
          catalog = json.load(open("resources/app-catalog.json"))
          jsonschema.validate(catalog, schema)
          print(f"{len(catalog['apps'])} recipes validate against schema "
                f"{catalog.get('schemaVersion')}")
          PYTHON

      - name: Check the migration is settled
        run: scripts/migrate-catalog.py --check resources/app-catalog.json

  # Deliberate breakage: a stick that fills up, one that is pulled out, one
  # that stores something shorter than it was given, and single-bit damage
  # everywhere in a finished archive. The gate is that no fault ever produces
  # data that reads back clean and wrong.
  fault-injection:
    name: Fault injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev liblzma-dev libssl-dev libsqlite3-dev

      - name: Build
        run: |
          cmake -S . -B build-fault -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DTRANSMIT_BUILD_TESTS=ON -DTRANSMIT_WERROR=ON \
                -DTRANSMIT_BUILD_APP=OFF -DTRANSMIT_BUILD_CLI=OFF
          cmake --build build-fault

      - name: Inject faults
        run: ctest --test-dir build-fault -L fault --output-on-failure

      # Again under the sanitisers. Half of what can go wrong when a write
      # fails part way through is a buffer that was sized from a number that
      # never arrived, and that is invisible in a plain build.
      - name: Build with sanitisers
        run: |
          cmake -S . -B build-fault-asan -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
                -DTRANSMIT_BUILD_TESTS=ON \
                -DTRANSMIT_BUILD_APP=OFF -DTRANSMIT_BUILD_CLI=OFF
          cmake --build build-fault-asan

      - name: Inject faults under the sanitisers
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-fault-asan -L fault --output-on-failure

  # Fuzzing the four places bytes from another machine first arrive.
  # Short on a pull request; the nightly job is where the long runs live.
  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev \
                                  libzstd-dev liblzma-dev libssl-dev libsqlite3-dev

      - name: Build the fuzzers
        run: |
          cmake -S . -B build-fuzz -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
                -DTRANSMIT_BUILD_TESTS=ON -DTRANSMIT_BUILD_FUZZERS=ON \
                -DTRANSMIT_BUILD_APP=OFF -DTRANSMIT_BUILD_CLI=OFF
          cmake --build build-fuzz

      - name: Fuzz
        run: |
          set -e
          for target in FuzzManifest FuzzContainerOpen FuzzSerialization FuzzPathToken; do
              echo "::group::$target"
              mkdir -p "corpus/$target"
              cp -r "tests/fuzz/corpus/regressions/$target/." "corpus/$target/" 2>/dev/null || true
              ./build-fuzz/tests/fuzz/transmit_fuzz_$target \
                  -max_total_time=60 -rss_limit_mb=4096 "corpus/$target"
              echo "::endgroup::"
          done

      # A crash leaves its input behind. Keeping it is what lets the fix
      # come with the case that found it.
      - name: Keep whatever crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
