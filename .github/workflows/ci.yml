name: build and test

# Windows and macOS are built here because they cannot be built anywhere else
# the project is developed. Every fault this matrix has found so far has been a
# real one - a folder table assembled from two different homes, Objective-C++
# compiled without the reference counting it was written for, shared buffers
# read from more than one worker at a time - so it is worth keeping honest.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job has a deadline.
#
# Without one, a job that hangs holds a runner until GitHub's own six-hour
# limit and then reports nothing - and from outside, a tree that is stuck
# looks exactly like a tree that is still working. That is the worst thing a
# check can be, and six hours is far too long to find out.
#
# The budgets are roughly three times what each job takes on a machine that is
# behaving, so a slow runner still finishes and a stuck one is cut off early
# enough to be worth knowing about.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtimageformats'
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev liblzma-dev libssl-dev \
                                  libsqlite3-dev libsecret-1-dev \
                                  libgl1-mesa-dev libgl1-mesa-dri libxkbcommon-x11-0 \
                                  xvfb weston libxcb-cursor0 \
                                  gnome-keyring libsecret-tools dbus-x11

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja zstd xz openssl@3 sqlite

      # Qt is installed for msvc2022_64 and vcpkg builds x64-windows, both of
      # which are MSVC-ABI. Without this the Ninja generator picks up whatever
      # g++ happens to be on PATH and produces objects that cannot link
      # against either of them.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install zlib:x64-windows zstd:x64-windows liblzma:x64-windows `
                        openssl:x64-windows sqlite3:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
        shell: pwsh

      # From here to the report, every step runs whatever the one before it
      # did, and each records what happened. One run then says everything that
      # is wrong rather than the first thing that is wrong - which matters most
      # on the two platforms nobody here can reproduce by hand.
      - name: Configure
        if: always()
        shell: bash
        run: scripts/ci-check.sh "Configure" cmake --preset default -DTRANSMIT_WERROR=ON

      - name: Build
        if: always()
        shell: bash
        run: scripts/ci-check.sh "Build" cmake --build --preset default

      - name: Test
        if: always()
        shell: bash
        run: scripts/ci-check.sh "The suite" scripts/run-tests.sh build

      # The credential tests skip themselves when there is no secret service,
      # which on a build machine means they would always skip. Giving them a
      # throwaway keyring is what makes them worth having.
      - name: Test against a real keyring
        if: always() && runner.os == 'Linux'
        run: |
          scripts/ci-check.sh "Credentials against a real keyring" bash -c '
            set -o pipefail
            dbus-run-session -- scripts/with-keyring.sh \
                ./build/tests/integration/transmit_SecretStore_test | tee keyring.log

            # The suite skips itself when there is no secret service, which is
            # the right behaviour on a developer machine and useless here: a
            # step that always skips reports success and proves nothing.
            if grep -q "SKIP   : SecretStoreTest::initTestCase" keyring.log; then
                echo "the credential tests skipped - no keyring was reachable"
                exit 1
            fi'

      # The interface has to open a window on a real windowing system and draw
      # into it, not merely link and stay alive under the offscreen platform.
      #
      # This replaced a step that started the binary offscreen and waited for a
      # timeout. That check was green for the whole life of 0.1.0, which
      # aborted on every Wayland desktop the moment it was launched: offscreen
      # never loads a platform plugin, never builds a graphics context and
      # never involves the scene graph, so the one thing that was broken was
      # the one thing it could not see.
      #
      # TRANSMIT_LAUNCH_TESTS_REQUIRED turns a missing Xvfb or weston into a
      # failure. Skipping is right on a developer's machine and useless here.
      - name: The interface has to start on a real display
        if: always() && runner.os == 'Linux'
        env:
          TRANSMIT_LAUNCH_TESTS_REQUIRED: 1
        run: |
          scripts/ci-check.sh "The interface starts on a real display" \
              ctest --test-dir build -L launch --output-on-failure

      # Two of the four cases are only registered against a Qt new enough not
      # to crash in its own Wayland client, which is a door for coverage to
      # leave through without anybody noticing: an older Qt here would mean a
      # shorter list and a green job. So the count is the check.
      - name: All four ways of launching have to be registered
        if: always() && runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2016
          scripts/ci-check.sh "All four ways of launching are registered" \
              bash -c 'registered=$(ctest --test-dir build -L launch -N \
                                    | grep -cE "^ +Test +#[0-9]+: Launch\.")
                       echo "$registered of 4 launch cases registered:"
                       ctest --test-dir build -L launch -N | grep -E "Launch\." || true
                       if [ "$registered" -ne 4 ]; then
                           echo "expected all four - offscreen, xcb, wayland," \
                                "wayland-no-buffers - and this Qt registered $registered"
                           exit 1
                       fi'

      # The same question on the two platforms with no headless session to
      # drive: start the interface on whatever the runner has and require a
      # painted frame. TRANSMIT_STARTUP_BENCHMARK quits once the window has
      # drawn, so finishing is the pass and a timeout is the failure - the
      # opposite way round from waiting to see whether it dies.
      - name: The interface has to start (macOS)
        if: always() && runner.os == 'macOS'
        env:
          TRANSMIT_STARTUP_BENCHMARK: 1
          QT_LOGGING_RULES: transmit.performance.debug=true
        run: scripts/ci-check.sh "The interface starts" scripts/start-once.sh build

      - name: The interface has to start (Windows)
        if: always() && runner.os == 'Windows'
        shell: bash
        env:
          TRANSMIT_STARTUP_BENCHMARK: 1
          QT_LOGGING_RULES: transmit.performance.debug=true
          # Qt builds the interface for the windowed subsystem, and its default
          # message handler sends output to the debugger rather than to stderr
          # when the process has no console. Started from here it has none, so
          # without this the log it is being read for is written somewhere
          # nothing can read it.
          QT_LOGGING_TO_CONSOLE: 1
        run: scripts/ci-check.sh "The interface starts" scripts/start-once.sh build

      - name: Round trip through the command line
        if: always()
        shell: bash
        run: scripts/ci-check.sh "A round trip through the command line" scripts/cli-round-trip.sh

      # The only step that decides anything.
      - name: What went wrong
        if: always()
        shell: bash
        run: scripts/ci-report.py --title "${{ matrix.name }}"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-results
          path: ci-results/
          if-no-files-found: warn

  quality:
    name: Formatting and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Every check writes its result here and returns 0. The report at the end
      # reads the pile, prints the cause of everything that failed, and fails
      # the job once - so one run says everything that is wrong rather than the
      # first thing that is wrong.
      TRANSMIT_CI_RESULTS: ci-results
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtimageformats'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy-18 clang-format-18 \
                                  libzstd-dev liblzma-dev libssl-dev libsqlite3-dev \
                                  libsecret-1-dev libgl1-mesa-dev \
                                  shellcheck cppcheck

      # The tidiness check reads the workflows to be sure the jobs the release
      # insists on still exist. Without PyYAML it says it could not and moves
      # on, which is honest and useless - so it is installed here, where that
      # check matters most.
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Fetch actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
              "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      # From here to the report, every step runs whatever the one before it
      # did. `if: always()` on each is what makes that true even for a step
      # that dies rather than returning.
      - name: Formatting
        if: always()
        run: scripts/ci-check.sh "Formatting" scripts/format.sh --check

      - name: QML modules
        if: always()
        run: scripts/ci-check.sh "Every QML file is registered" scripts/check-qml-modules.sh

      # docs/design.md is the source of truth for the interface, and neither of
      # these can be enforced by review: a hard-coded 13 in one page looks like
      # nothing, and a colour pair that is a shade too close is invisible to
      # anyone who is not measuring it.
      - name: Design tokens
        if: always()
        run: scripts/ci-check.sh "Design tokens are used" scripts/check-design-tokens.sh

      - name: Palette contrast
        if: always()
        run: scripts/ci-check.sh "The palette is readable" python3 scripts/check-contrast.py

      # A packaging file left on the old version is only ever discovered by
      # whoever builds that package, which is usually not us.
      - name: Versions agree
        if: always()
        run: scripts/ci-check.sh "Every version in the tree agrees" scripts/version.py --check

      - name: Tidiness
        if: always()
        run: scripts/ci-check.sh "Whitespace, newlines, registered tests" scripts/check-hygiene.py

      - name: Shell scripts
        if: always()
        run: |
          # The script below is handed to bash -c and the expansions in it
          # belong to that shell, so the single quotes are the point.
          # shellcheck disable=SC2016
          scripts/ci-check.sh "Shell scripts" bash -c '
            files=$(git ls-files "*.sh")
            [ -n "$files" ] || { echo "no shell scripts found - has the glob rotted?"; exit 1; }
            echo "$files" | tr "\n" " "
            # shellcheck disable=SC2086
            shellcheck --severity=warning $files'

      - name: Workflows
        if: always()
        run: |
          scripts/ci-check.sh "Workflow files" bash -c \
            './actionlint -color .github/workflows/*.yml'

      - name: Python
        if: always()
        run: |
          # The script below is handed to bash -c and the expansions in it
          # belong to that shell, so the single quotes are the point.
          # shellcheck disable=SC2016
          scripts/ci-check.sh "Python scripts compile" bash -c '
            files=$(git ls-files "*.py")
            [ -n "$files" ] || { echo "no python found - has the glob rotted?"; exit 1; }
            # shellcheck disable=SC2086
            python3 -m py_compile $files && echo "compiled $(echo "$files" | wc -l) files"'

      - name: JSON
        if: always()
        run: |
          # The script below is handed to bash -c and the expansions in it
          # belong to that shell, so the single quotes are the point.
          # shellcheck disable=SC2016
          scripts/ci-check.sh "Every JSON file parses" bash -c '
            failed=0
            for file in $(git ls-files "*.json"); do
                python3 -m json.tool "$file" > /dev/null || { echo "  $file"; failed=1; }
            done
            exit $failed'

      # The full build rather than cli-only: clang-tidy reads a compile
      # database, and the application layer is only in one when the interface
      # is built. That layer holds the controllers, which is where the
      # threading is.
      - name: Configure
        if: always()
        run: scripts/ci-check.sh "Configure" cmake --preset default

      - name: Build
        if: always()
        run: scripts/ci-check.sh "Build" cmake --build --preset default

      - name: Static analysis
        if: always()
        run: |
          # The script below is handed to bash -c and the expansions in it
          # belong to that shell, so the single quotes are the point.
          # shellcheck disable=SC2016
          scripts/ci-check.sh "clang-tidy" bash -c '
            # Everything this machine can compile. Windows and macOS sources
            # are not in a Linux compile database at all, so they are excluded
            # here and covered by the three-platform build job instead.
            files=$(git ls-files src/ | grep -E "\.cpp$" | grep -vE "^src/platform/(windows|macos)/")
            count=$(printf "%s\n" "$files" | wc -l)
            echo "analysing $count files"

            # A pathspec that stops matching is silent - the step would pass
            # having analysed nothing at all. This is the tripwire for that.
            if [ "$count" -lt 50 ]; then
                echo "only $count files matched; the file list has stopped working"
                exit 1
            fi

            # shellcheck disable=SC2086
            run-clang-tidy-18 -p build -j "$(nproc)" -quiet $files'

      # A second opinion. cppcheck reads the code rather than the compile
      # database, so it reaches the Windows and macOS sources clang-tidy above
      # cannot see from a Linux runner.
      - name: cppcheck
        if: always()
        run: |
          scripts/ci-check.sh "cppcheck" bash -c '
            # Not the performance category: on this codebase every one of
            # its findings so far has been a misreading of a string_view
            # built from a pointer and a length, and a check that cries wolf
            # is one people learn to skip. unknownMacro is Qt: cppcheck does
            # not know Q_PROPERTY without moc, and that is not a defect.
            cppcheck --quiet --error-exitcode=1 --inline-suppr \
                     --enable=warning,portability \
                     --suppress=missingIncludeSystem \
                     --suppress=unknownMacro \
                     --std=c++20 --language=c++ \
                     -I src src/'

      - name: QML linting
        if: always()
        run: |
          # The script below is handed to bash -c and the expansions in it
          # belong to that shell, so the single quotes are the point.
          # shellcheck disable=SC2016
          scripts/ci-check.sh "qmllint" bash -c '
            lint=$(find "$QT_ROOT_DIR/bin" -name "qmllint" | head -1)
            if [ -z "$lint" ]; then
                echo "qmllint is not in this Qt build"
                exit 1
            fi

            # unqualified, unresolved-type and import are turned down to
            # notes rather than off. The first two are style this project has
            # not finished paying off; the third is qmllint not being able to
            # see a statically linked QML module the way the build can. What
            # is left failing is the part that is a defect: a size set on an
            # item a layout is arranging, a property that does not exist, a
            # type error.
            # shellcheck disable=SC2046
            "$lint" -I build/qml -I "$QT_ROOT_DIR/qml" \
                    --unqualified info --unresolved-type info --import info \
                    $(git ls-files "src/ui/qml/*.qml")'

      # The only step that decides anything. Everything above recorded what
      # happened and carried on.
      - name: What went wrong
        if: always()
        run: scripts/ci-report.py --title "Formatting and static analysis"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-results
          path: ci-results/
          if-no-files-found: warn

  # The sanitisers the asan preset was written for and CI never ran.
  #
  # Address and undefined behaviour over everything.
  #
  # Thread over the suites that link no Qt. That is not squeamishness: a
  # sanitiser cannot see synchronisation performed inside an
  # uninstrumented library, and Qt here is a distribution build. Run
  # against the integration suites it reports races in Qt's own
  # containers - two compression workers reallocating a QArrayData
  # inside QtConcurrent - which are neither ours nor real, and it says
  # nothing whatever about our code. Suppressing them would hide the
  # reports worth having.
  #
  # The concurrency that actually touches user data is
  # ArchiveWriter::prepare being called from many workers at once, and
  # ContainerTest::PreparesBlocksFromManyThreadsAtOnce exercises exactly
  # that with plain std::thread, where every frame is instrumented and a
  # report would be real.
  sanitizers:
    name: Sanitisers (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: asan-ubsan
            preset: asan
            ctest: --preset asan
          - kind: tsan
            preset: tsan
            ctest: --test-dir build-tsan -L 'format|property|fault'

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtimageformats'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev liblzma-dev libssl-dev \
                                  libsqlite3-dev libsecret-1-dev \
                                  libgl1-mesa-dev libxkbcommon-x11-0

      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env:
          # Qt and the QML engine hold allocations at exit by design, so
          # the suppressions are narrow. detect_leaks=0 would be the easy
          # way out and would also switch off the thing worth having.
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1:check_initialization_order=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          QT_QPA_PLATFORM: offscreen
        run: ctest ${{ matrix.ctest }} --output-on-failure

  # The catalog is the only part of Transmit whose content is data rather than
  # code, and the only part a user can extend without building anything. Both
  # of those mean it has to be checked as data.
  catalog:
    name: Application catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet jsonschema
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev liblzma-dev libssl-dev libsqlite3-dev

      - name: Check it against the schema
        run: |
          python3 - <<'PYTHON'
          import json
          import jsonschema

          schema = json.load(open("resources/app-catalog.schema.json"))
          catalog = json.load(open("resources/app-catalog.json"))
          jsonschema.validate(catalog, schema)
          print(f"{len(catalog['apps'])} recipes validate against schema "
                f"{catalog.get('schemaVersion')}")
          PYTHON

      - name: Check the migration is settled
        run: scripts/migrate-catalog.py --check resources/app-catalog.json

  # Deliberate breakage: a stick that fills up, one that is pulled out, one
  # that stores something shorter than it was given, and single-bit damage
  # everywhere in a finished archive. The gate is that no fault ever produces
  # data that reads back clean and wrong.
  fault-injection:
    name: Fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev liblzma-dev libssl-dev libsqlite3-dev

      - name: Build
        run: |
          cmake -S . -B build-fault -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DTRANSMIT_BUILD_TESTS=ON -DTRANSMIT_WERROR=ON \
                -DTRANSMIT_BUILD_APP=OFF -DTRANSMIT_BUILD_CLI=OFF
          cmake --build build-fault

      - name: Inject faults
        run: ctest --test-dir build-fault -L fault --output-on-failure

      # Again under the sanitisers. Half of what can go wrong when a write
      # fails part way through is a buffer that was sized from a number that
      # never arrived, and that is invisible in a plain build.
      - name: Build with sanitisers
        run: |
          cmake -S . -B build-fault-asan -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
                -DTRANSMIT_BUILD_TESTS=ON \
                -DTRANSMIT_BUILD_APP=OFF -DTRANSMIT_BUILD_CLI=OFF
          cmake --build build-fault-asan

      - name: Inject faults under the sanitisers
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-fault-asan -L fault --output-on-failure

  # Fuzzing the four places bytes from another machine first arrive.
  # Short on a pull request; the nightly job is where the long runs live.
  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev \
                                  libzstd-dev liblzma-dev libssl-dev libsqlite3-dev

      - name: Build the fuzzers
        run: |
          cmake -S . -B build-fuzz -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
                -DTRANSMIT_BUILD_TESTS=ON -DTRANSMIT_BUILD_FUZZERS=ON \
                -DTRANSMIT_BUILD_APP=OFF -DTRANSMIT_BUILD_CLI=OFF
          cmake --build build-fuzz

      - name: Fuzz
        run: |
          set -e
          for target in FuzzManifest FuzzContainerOpen FuzzSerialization FuzzPathToken; do
              echo "::group::$target"
              mkdir -p "corpus/$target"
              cp -r "tests/fuzz/corpus/regressions/$target/." "corpus/$target/" 2>/dev/null || true
              ./build-fuzz/tests/fuzz/transmit_fuzz_$target \
                  -max_total_time=60 -rss_limit_mb=4096 "corpus/$target"
              echo "::endgroup::"
          done

      # A crash leaves its input behind. Keeping it is what lets the fix
      # come with the case that found it.
      - name: Keep whatever crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  # Which lines the suite actually runs, and - the question that matters more -
  # whether the lines a change adds are among them.
  #
  # A project this size can absorb a great deal of untested new code before its
  # overall percentage moves at all, and by the time it does the untested code
  # is everywhere. So the overall floor is set just under where the project
  # already is, to catch a real fall, while new lines are held to a standard
  # nobody could retrofit but everybody can meet on the code they just wrote.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-line check needs the history back to where this branch
          # left main; a shallow clone has no merge base to diff against.
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtimageformats'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 llvm-18 libclang-rt-18-dev \
                                  libzstd-dev liblzma-dev libssl-dev \
                                  libsqlite3-dev libsecret-1-dev \
                                  libgl1-mesa-dev libxkbcommon-x11-0 xvfb \
                                  gnome-keyring libsecret-tools dbus-x11

      - name: Measure
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          # On a pull request the base is the branch being merged into; on a
          # push to main it is the commit before, so "the lines this change
          # adds" means the same thing either way.
          if [ -n "${{ github.base_ref }}" ]; then
              base="origin/${{ github.base_ref }}"
          else
              base="${{ github.event.before }}"
          fi
          git rev-parse --verify "$base" >/dev/null 2>&1 || base=""
          scripts/coverage.sh ${base:+--base "$base"}

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build-coverage/coverage.json
          if-no-files-found: ignore

  # The numbers this project promises, checked against the ones it promised
  # last time.
  #
  # Linux only, and deliberately so: the Windows and macOS runners are shared
  # hardware with a noise floor wide enough that a gate on them would fire on
  # other people's builds. A gate that fires on noise is a gate everybody
  # learns to ignore, which is worse than not having one.
  #
  # The comparison is against the machine rather than the clock. Every run
  # measures a fixed amount of work that owes nothing to this project, and
  # every other measurement is divided by it - so a slow runner cancels out and
  # what is left is the code. Before that, a baseline from faster hardware made
  # the gate fire on nothing being wrong, which it did: identical code came in
  # 15.2% "slower" purely because that day's runner hashed at 548 MiB/s instead
  # of 631.
  #
  # When a change is a deliberate trade, re-run this, take the numbers out of
  # the artifact it uploads, and commit them with the change.
  benchmark:
    name: Speed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev liblzma-dev libssl-dev \
                                  libsqlite3-dev qt6-base-dev

      - name: Build
        run: |
          cmake -S . -B build-bench -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DTRANSMIT_BUILD_BENCH=ON \
                -DTRANSMIT_BUILD_TESTS=OFF -DTRANSMIT_BUILD_APP=OFF
          cmake --build build-bench --target transmit_bench

      # In memory rather than on the runner's disk, which is network-backed and
      # varies by more than anything being measured here.
      - name: Make a corpus
        run: |
          ./build-bench/transmit_bench corpus --corpus /dev/shm/corpus \
              --profile mixed --seed 20260829

      - name: The per-byte primitives
        run: |
          ./build-bench/transmit_bench micro --repeat 5 --json micro.json
          python3 tests/bench/compare.py tests/bench/baseline-micro.json micro.json --tolerance 15

      - name: Capture
        run: |
          ./build-bench/transmit_bench capture --corpus /dev/shm/corpus \
              --out /dev/shm/bench.txa --repeat 3 --json capture.json
          python3 tests/bench/compare.py tests/bench/baseline-capture.json capture.json \
              --tolerance 20 --size-tolerance 5

      - name: Restore
        run: |
          ./build-bench/transmit_bench restore --archive /dev/shm/bench.txa \
              --into /dev/shm/restored --repeat 3 --json restore.json
          python3 tests/bench/compare.py tests/bench/baseline-restore.json restore.json \
              --tolerance 20

      # The measurement is worth keeping whether or not it passed: a run that
      # failed the gate is the one somebody needs the numbers from.
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            micro.json
            capture.json
            restore.json
          if-no-files-found: ignore
