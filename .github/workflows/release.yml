name: release

# Builds what people actually download, and attaches it to the tag.
#
# Both ways of cutting a release end up here, because both are things people
# actually do: pushing a tag from a terminal, and filling in the form under
# Releases. The first fires a push event and this workflow creates the release;
# the second creates the release first and this workflow uploads into it.
#
# A manual run builds the same things and leaves them on the run, so the
# packaging can be changed and checked without spending a version number.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A red tree must not be able to ship.
  #
  # The tag points at a commit, and the checks either passed on that commit or
  # they did not. This asks rather than rebuilding, deliberately: running the
  # suite again would only prove that the second run passed, whereas what has
  # to be true is that the checks people rely on ran against exactly the bytes
  # being published.
  #
  # It names the jobs rather than reading the run's overall conclusion. A run
  # can be green with a job skipped - a cancelled leg, a matrix entry that
  # never started - and "nothing failed" is not the same claim as "the
  # sanitisers passed on this commit".
  checks:
    name: Refuse to ship a red tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # Deliberately a skipped step rather than a skipped job. A job that does
      # not run takes everything that needs it down with it, so gating the
      # whole job on the event would mean the gate quietly disappearing the
      # day somebody makes a manual run publish something.
      - name: A manual run publishes nothing, so there is nothing to gate
        if: github.event_name == 'workflow_dispatch'
        run: echo "A manual run publishes nothing, so the checks are not consulted."

      - name: Ask what the checks said about this commit
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Looking for a completed CI run on $SHA"

          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
                   --jq '[.workflow_runs[] | select(.status == "completed")]')
          latest=$(printf '%s' "$runs" | jq -r 'sort_by(.run_number) | last | .id // empty')

          if [ -z "$latest" ]; then
            echo "::error::No completed CI run for $SHA. Nothing is published from a commit"
            echo "::error::whose checks have not finished - push the commit, wait for CI, then tag it."
            exit 1
          fi
          echo "CI run $latest"

          jobs=$(gh api "repos/$REPO/actions/runs/$latest/jobs?per_page=100" --jq '.jobs')
          printf '%s' "$jobs" | jq -r '.[] | "  \(.conclusion // .status)\t\(.name)"'

          # Every job that has to have passed, by the name it reports. Missing
          # counts as failure: a job that did not run cannot have passed.
          #
          # Speed and Coverage are deliberately not here. Both are about how
          # good the code is rather than whether it works, and neither answers
          # "is this safe to give somebody". Requiring them would mean a
          # measurement blocking a release that is correct in every way, which
          # is how a gate stops being taken seriously.
          required=(
            "Linux" "Windows" "macOS"
            "Formatting and static analysis"
            "Sanitisers (asan-ubsan)" "Sanitisers (tsan)"
            "Application catalog"
          )

          bad=0
          for name in "${required[@]}"; do
            got=$(printf '%s' "$jobs" | jq -r --arg n "$name" \
                    '[.[] | select(.name == $n)] | last | .conclusion // "did not run"')
            if [ "$got" != "success" ]; then
              echo "::error::$name: $got"
              bad=1
            fi
          done

          if [ "$bad" -ne 0 ]; then
            echo "::error::Refusing to publish: the checks above did not pass on $SHA."
            exit 1
          fi
          echo "Every required check passed on this commit."

  # The version is worked out once and handed to every job, so the installer,
  # the disk image and the file names cannot disagree with each other.
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick it
        id: pick
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          declared=$(scripts/version.py --print)

          # Empty for a manual run, which builds without publishing.
          if [ "${GITHUB_EVENT_NAME}" = release ]; then
              tag="$RELEASE_TAG"
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
              tag="${GITHUB_REF_NAME}"
          else
              tag=""
          fi

          # The tag decides. This used to fail the release when the tag and
          # CMakeLists.txt disagreed, which is a true statement made at the
          # worst possible moment: it tells somebody at the end of a release
          # that they should have edited eight files at the beginning of one.
          #
          # Every build job rewrites the tree to this version before it
          # compiles anything, so the installer, the disk image, the packaging
          # recipes and the binary cannot report different versions from each
          # other or from the tag they came from.
          version="$declared"
          if [ -n "$tag" ]; then
              version="${tag#v}"
              if [ "$version" != "$declared" ]; then
                  echo "::notice::tag $tag overrides the $declared in the tree"
              fi
          fi

          # Said rather than enforced. A release with nothing written about
          # it is worth a word, and is not worth refusing to publish over.
          if [ -n "$tag" ] && ! grep -q "^## ${version}\\b" CHANGELOG.md; then
              echo "::warning::CHANGELOG.md has no '## $version' section"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $version${tag:+ for $tag}"

  linux:
    name: Linux (AppImage)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The tag decides the version, so the tree is rewritten to match it
      # before anything is compiled or packaged. Without this the binary, the
      # installer, the disk image and the packaging recipes each report
      # whatever was last committed, and only one of them is ever right.
      #
      # A manual run has no tag, so this rewrites the tree to what it already
      # says and prints nothing.
      - name: Write the version the tag asks for
        shell: bash
        env:
          WANTED: ${{ needs.version.outputs.version }}
        run: |
          python=python3
          command -v "$python" >/dev/null 2>&1 || python=python
          "$python" scripts/version.py --set "$WANTED"
          git --no-pager diff --stat

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtimageformats'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev liblzma-dev libssl-dev \
                                  libsqlite3-dev libsecret-1-dev \
                                  libgl1-mesa-dev libgl1-mesa-dri libxkbcommon-x11-0 \
                                  libxcb-cursor0 xvfb weston \
                                  libfuse2 file

      - name: Build
        run: |
          cmake --preset release -DTRANSMIT_BUILD_TESTS=ON
          cmake --build --preset release

      # A release is the one build nobody gets to re-run, so it is tested
      # before it is packaged rather than trusted because main was green.
      - name: Test
        run: ctest --test-dir build-release --output-on-failure

      - name: Assemble the AppImage
        env:
          # The runners have no FUSE for the tools' own AppImages either.
          APPIMAGE_EXTRACT_AND_RUN: 1
          QML_SOURCES_PATHS: ${{ github.workspace }}/src/ui/qml
          EXTRA_QT_MODULES: 'wayland-decoration-client;wayland-graphics-integration-client;wayland-shell-integration'
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy \
              "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt \
              "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          # Only xcb is deployed by default, which on a Wayland session with no
          # XWayland means the window never opens at all. Named from what the
          # Qt build actually has, so a missing one is a warning here rather
          # than a plugin the bundle claims and does not carry.
          plugins=""
          for plugin in libqwayland-generic.so libqwayland-egl.so libqoffscreen.so; do
              if [ -e "${QT_ROOT_DIR}/plugins/platforms/$plugin" ]; then
                  plugins="${plugins}${plugins:+;}$plugin"
              else
                  echo "::warning::this Qt build has no $plugin"
              fi
          done
          export EXTRA_PLATFORM_PLUGINS="$plugins"
          echo "extra platform plugins: $EXTRA_PLATFORM_PLUGINS"

          # Carried in by hand, because nothing else carries it.
          #
          # The Qt plugin deploys the Wayland shell and decoration plugins and
          # stops there. The client buffer integration - the piece that gives a
          # Wayland window an OpenGL context - is left behind, and Qt Quick
          # does not survive its absence: it prints "Failed to initialize
          # graphics backend for OpenGL" and calls qFatal, so the bundle dumps
          # core before a window ever appears. That is how 0.1.0 shipped, and
          # every check the project had was green, because none of them ran it
          # on Wayland.
          #
          # --deploy-deps-only makes linuxdeploy treat what was copied as part
          # of the bundle and pull in the libraries it needs.
          mkdir -p AppDir/usr/plugins
          cp -r "${QT_ROOT_DIR}/plugins/wayland-graphics-integration-client" \
                AppDir/usr/plugins/

          # The command line tool travels with the interface: they share the
          # bundled Qt, and somebody restoring onto a headless machine needs it.
          ./linuxdeploy --appdir AppDir \
              --executable build-release/transmit \
              --executable build-release/transmit-cli \
              --desktop-file resources/transmit.desktop \
              --icon-file resources/icons/transmit.svg \
              --deploy-deps-only=AppDir/usr/plugins/wayland-graphics-integration-client \
              --plugin qt \
              --output appimage

          mkdir -p artifacts
          mv Transmit*.AppImage \
             "artifacts/Transmit-${{ needs.version.outputs.version }}-linux-x86_64.AppImage"

      # Packaging is where a QML module or a plugin goes missing without
      # anything failing to build, so the bundle is unpacked and inspected
      # before it is started.
      - name: Check what the bundle carries
        run: |
          chmod +x artifacts/*.AppImage

          # Named rather than globbed into the command position: a glob that
          # matched two files would run one and pass the other as an argument,
          # and a glob that matched none would run the pattern.
          image=$(find artifacts -name '*.AppImage' -type f | head -1)
          if [ -z "$image" ]; then
              echo "::error::no AppImage was produced"
              exit 1
          fi
          "$image" --appimage-extract >/dev/null

          if [ ! -x squashfs-root/usr/bin/transmit-cli ]; then
              echo "::error::the command line tool is missing from the bundle"
              exit 1
          fi

          # Named one by one rather than counted, because the failure this
          # guards against is a single directory quietly not being copied.
          # 0.1.0 shipped without wayland-graphics-integration-client and
          # aborted on every Wayland desktop.
          missing=0
          for directory in platforms imageformats platformthemes \
                           wayland-shell-integration \
                           wayland-decoration-client \
                           wayland-graphics-integration-client; do
              if [ ! -d "squashfs-root/usr/plugins/$directory" ]; then
                  echo "::error::the bundle has no plugins/$directory"
                  missing=1
              fi
          done

          # The platform plugins a Linux desktop actually uses. Only xcb is
          # deployed by default, and a bundle with no Wayland platform plugin
          # never opens a window on a session that has no XWayland.
          for plugin in libqxcb.so libqwayland-generic.so; do
              if [ ! -e "squashfs-root/usr/plugins/platforms/$plugin" ]; then
                  echo "::error::the bundle has no platforms/$plugin"
                  missing=1
              fi
          done

          # The client buffer integration is only useful if the library behind
          # it came too.
          if [ ! -e squashfs-root/usr/plugins/wayland-graphics-integration-client/libqt-plugin-wayland-egl.so ]; then
              echo "::error::the Wayland OpenGL integration plugin is missing"
              missing=1
          fi

          echo "::group::Plugins in the bundle"
          find squashfs-root/usr/plugins -type f -name '*.so' | sort
          echo "::endgroup::"

          exit "$missing"

      # And then it is started, on a real X server and a real Wayland
      # compositor, and has to paint a frame on both.
      #
      # The check this replaced started the bundle under the offscreen platform
      # and waited for a timeout. It passed on the build that dumped core on
      # every Wayland desktop, because offscreen loads no platform plugin and
      # builds no graphics context.
      - name: Check it runs
        env:
          TRANSMIT_LAUNCH_TESTS_REQUIRED: 1
        run: |
          for mode in offscreen xcb wayland; do
              echo "::group::Launching the bundle: $mode"
              bash tests/launch/launch-test.sh \
                  --binary squashfs-root/usr/bin/transmit --mode "$mode"
              echo "::endgroup::"
          done

          # The same run again with the Wayland client buffer integration taken
          # away, which is what a bundle that lost the plugin looks like from
          # the inside. It has to fall back to drawing in software rather than
          # aborting, so that a packaging mistake costs speed and not the whole
          # program.
          echo "::group::Launching the bundle: Wayland with no OpenGL"
          bash tests/launch/launch-test.sh \
              --binary squashfs-root/usr/bin/transmit --mode wayland \
              --without-buffer-integration --expect-software
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: macOS (disk image)
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # The tag decides the version, so the tree is rewritten to match it
      # before anything is compiled or packaged. Without this the binary, the
      # installer, the disk image and the packaging recipes each report
      # whatever was last committed, and only one of them is ever right.
      #
      # A manual run has no tag, so this rewrites the tree to what it already
      # says and prints nothing.
      - name: Write the version the tag asks for
        shell: bash
        env:
          WANTED: ${{ needs.version.outputs.version }}
        run: |
          python=python3
          command -v "$python" >/dev/null 2>&1 || python=python
          "$python" scripts/version.py --set "$WANTED"
          git --no-pager diff --stat

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtimageformats'
          cache: true

      - name: Install dependencies
        run: brew install ninja zstd xz openssl@3 sqlite

      - name: Build
        run: |
          cmake --preset release -DTRANSMIT_BUILD_TESTS=ON
          cmake --build --preset release

      - name: Test
        run: ctest --test-dir build-release --output-on-failure

      # Unsigned, and said so in the release notes: signing needs credentials
      # that a public workflow has no business holding.
      - name: Build the disk image
        run: |
          # build-dmg.sh only warns when macdeployqt is missing, so that it
          # stays useful on a machine with Qt installed. Here that warning
          # would ship a disk image that runs on the runner and nowhere else.
          if ! command -v macdeployqt >/dev/null 2>&1; then
              echo "::error::macdeployqt is not on PATH"
              exit 1
          fi

          packaging/macos/build-dmg.sh build-release

          for needed in Contents/Frameworks/QtCore.framework \
                        Contents/Resources/qml \
                        Contents/Resources/transmit.icns \
                        Contents/MacOS/transmit-cli; do
              if [ ! -e "build-release/transmit.app/$needed" ]; then
                  echo "::error::the bundle is missing $needed"
                  exit 1
              fi
          done

      # Started, not merely produced. A bundle whose frameworks or QML were
      # deployed incompletely builds, installs and then fails to open a window,
      # which is the worst way for somebody to find out.
      - name: Check it runs
        env:
          TRANSMIT_STARTUP_BENCHMARK: 1
          QT_LOGGING_RULES: transmit.performance.debug=true
        run: |
          set +e
          ./build-release/transmit.app/Contents/MacOS/transmit > started.log 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid"
              cat started.log
              echo "::error::the packaged interface never painted a frame"
              exit 1
          fi
          wait "$pid"
          status=$?
          set -e

          cat started.log
          if [ "$status" -ne 0 ]; then
              echo "::error::the packaged interface exited with $status"
              exit 1
          fi
          grep -q "first frame after" started.log || {
              echo "::error::the packaged interface drew nothing"
              exit 1
          }
          if grep -qE "is not a type|failed to load|not installed" started.log; then
              echo "::error::the packaged interface started with QML errors"
              exit 1
          fi

      - name: Collect
        run: |
          mkdir -p artifacts
          mv build-release/Transmit.dmg \
             "artifacts/Transmit-${{ needs.version.outputs.version }}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Windows (installer and portable)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The tag decides the version, so the tree is rewritten to match it
      # before anything is compiled or packaged. Without this the binary, the
      # installer, the disk image and the packaging recipes each report
      # whatever was last committed, and only one of them is ever right.
      #
      # A manual run has no tag, so this rewrites the tree to what it already
      # says and prints nothing.
      - name: Write the version the tag asks for
        shell: bash
        env:
          WANTED: ${{ needs.version.outputs.version }}
        run: |
          python=python3
          command -v "$python" >/dev/null 2>&1 || python=python
          "$python" scripts/version.py --set "$WANTED"
          git --no-pager diff --stat

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtimageformats'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows zstd:x64-windows liblzma:x64-windows `
                        openssl:x64-windows sqlite3:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Build
        run: |
          cmake --preset release -DTRANSMIT_BUILD_TESTS=ON
          cmake --build --preset release

      - name: Test
        run: ctest --test-dir build-release --output-on-failure

      # windeployqt copies the Qt libraries, the QML modules and the platform
      # plugins next to the executables; the vcpkg DLLs are already beside them
      # from the build.
      - name: Stage the files
        shell: pwsh
        run: |
          $staging = "packaging/windows/staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item build-release/transmit.exe, build-release/transmit-cli.exe $staging
          Copy-Item build-release/*.dll $staging -ErrorAction SilentlyContinue
          windeployqt --qmldir src/ui/qml --release "$staging/transmit.exe"
          windeployqt --release "$staging/transmit-cli.exe"

          # An installer built from an incomplete staging directory installs
          # cleanly and then fails to start, which is the worst way to find out.
          foreach ($needed in "Qt6Core.dll", "Qt6Quick.dll", "platforms/qwindows.dll", "qml") {
              if (-not (Test-Path "$staging/$needed")) {
                  throw "windeployqt did not produce $needed"
              }
          }

      # The staged tree is what both the installer and the portable archive are
      # made of, so it is started here, once, before either is built.
      - name: Check it runs
        shell: pwsh
        env:
          TRANSMIT_STARTUP_BENCHMARK: 1
          QT_LOGGING_RULES: transmit.performance.debug=true
          # Qt builds the interface for the windowed subsystem, and its default
          # message handler sends output to the debugger rather than to stderr
          # when the process has no console - which, started from here, it has
          # not got.
          QT_LOGGING_TO_CONSOLE: 1
        run: |
          $staged = "packaging/windows/staging/transmit.exe"
          $process = Start-Process -FilePath $staged -PassThru `
              -RedirectStandardOutput started.log -RedirectStandardError started.err
          if (-not $process.WaitForExit(90000)) {
              $process.Kill()
              Get-Content started.log, started.err -ErrorAction SilentlyContinue
              throw "the packaged interface never painted a frame"
          }
          Get-Content started.log, started.err -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
              throw "the packaged interface exited with $($process.ExitCode)"
          }
          # Both streams, because which one carries the log depends on how Qt
          # decided to write it.
          if (-not (Select-String -Path started.log, started.err `
                        -Pattern "first frame after" -Quiet)) {
              throw "the packaged interface drew nothing"
          }
          if (Select-String -Path started.log, started.err `
                  -Pattern "is not a type|failed to load|not installed" -Quiet) {
              throw "the packaged interface started with QML errors"
          }

      - name: Build the installer
        shell: pwsh
        run: |
          # NSIS ships with the runner image but is not always on PATH, and a
          # release that fails for that reason is not worth the surprise.
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
              choco install nsis -y --no-progress
          }
          & $makensis /DVERSION=${{ needs.version.outputs.version }} packaging/windows/transmit.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Move-Item packaging/windows/TransmitSetup.exe `
              "artifacts/Transmit-${{ needs.version.outputs.version }}-windows-x64-setup.exe"

      # Not everyone can install software on the machine they are moving to,
      # which is exactly the situation this program is for.
      - name: Build the portable archive
        shell: pwsh
        run: |
          Compress-Archive -Path packaging/windows/staging/* `
              -DestinationPath "artifacts/Transmit-${{ needs.version.outputs.version }}-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, checks, linux, macos, windows]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloads

      - name: Gather and checksum
        run: |
          mkdir -p release
          find downloads -type f -exec mv {} release/ \;
          cd release
          sha256sum -- * > SHA256SUMS
          ls -l

      # The feed the updater reads, built from the files that are actually
      # being uploaded and signed over its own exact bytes.
      #
      # Without UPDATE_SIGNING_KEY the feed is still published and still
      # correct, and every copy of Transmit that reads it will report the new
      # version and install nothing. That is the safe half of the feature
      # working on its own, not a broken release: nothing installs code it
      # cannot authenticate.
      - name: Build the update feed
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          # Older releases stay listed, so somebody several versions behind
          # still sees a path forward and a critical fix keeps applying to
          # every version below it. A first release has nothing to carry.
          previous=""
          if curl -fsSL -o previous.json \
                  "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/updates.json"
          then
              previous="--previous previous.json"
              echo "carrying forward the releases in the existing feed"
          else
              echo "no earlier feed to carry forward"
          fi

          key=""
          if [ -n "${UPDATE_SIGNING_KEY:-}" ]; then
              # Written where only this job can read it, and removed before the
              # step ends whether or not the script succeeded.
              umask 077
              printf '%s' "$UPDATE_SIGNING_KEY" > signing-key.pem
              trap 'rm -f signing-key.pem' EXIT
              key="--sign-key signing-key.pem"
          else
              echo "::warning::no UPDATE_SIGNING_KEY, so this feed is unsigned and no copy of"
              echo "::warning::Transmit will install from it - see CONTRIBUTING.md"
          fi

          tag="${TAG:-v$VERSION}"
          # shellcheck disable=SC2086
          python3 scripts/make-update-feed.py \
              --version "$VERSION" \
              --directory release \
              --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}" \
              --out release/updates.json \
              $previous $key

          # Read back and checked here rather than discovered by somebody's
          # machine: a feed that does not parse stops every future update.
          python3 -c "
          import json, sys
          feed = json.load(open('release/updates.json'))
          assert feed['schema'] == 1, feed['schema']
          assert feed['releases'], 'no releases'
          for release in feed['releases']:
              assert release['artifacts'], release['version']
              for artifact in release['artifacts']:
                  assert len(artifact['blake2b']) == 64, artifact
                  assert artifact['url'].startswith('https://'), artifact
          print('the feed lists', len(feed['releases']), 'releases')
          "

          # The checksums were written before the feed existed, so they are
          # written again with it in. The old file is removed first so it does
          # not end up listed inside its own replacement.
          ( cd release && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS )
          ls -l release

      - name: Write the notes
        run: |
          version=${{ needs.version.outputs.version }}
          cat > notes.md <<EOF
          ## Downloads

          | File | For |
          | --- | --- |
          | \`Transmit-$version-linux-x86_64.AppImage\` | Linux. \`chmod +x\` it and run it. |
          | \`Transmit-$version-macos-arm64.dmg\` | macOS 14 and later, Apple silicon. |
          | \`Transmit-$version-windows-x64-setup.exe\` | Windows 10 1809 and later. |
          | \`Transmit-$version-windows-x64-portable.zip\` | Windows, without installing anything. |

          Every file's SHA-256 is in \`SHA256SUMS\`.

          The macOS disk image and the Windows installer are **not signed**.
          macOS will refuse the first launch: open it from the Finder's context
          menu and choose Open. Windows SmartScreen will warn once.

          Each build carries both programs: the window, and \`transmit-cli\`
          for machines with no display.
          EOF
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # The release exists already when somebody made it from the Releases
          # page, and does not when a tag was pushed from a terminal. Uploading
          # into one that is already written keeps whatever notes they wrote.
          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" release/* --clobber
              echo "uploaded into the existing $TAG release"
          else
              gh release create "$TAG" release/* \
                  --title "Transmit $TAG" \
                  --notes-file notes.md \
                  --verify-tag
              echo "created the $TAG release"
          fi
