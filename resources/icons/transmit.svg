<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Transmit</title>
  <!-- Two machines and the drive that carries one to the other. -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#2f6fed"/>

  <!-- the machine being left behind -->
  <rect x="20" y="40" width="34" height="26" rx="3" fill="#ffffff" opacity="0.55"/>
  <rect x="28" y="66" width="18" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>

  <!-- the machine being arrived at -->
  <rect x="74" y="40" width="34" height="26" rx="3" fill="#ffffff"/>
  <rect x="82" y="66" width="18" height="3" rx="1.5" fill="#ffffff"/>

  <!-- the crossing -->
  <path d="M52 84 H70 M64 78 l8 6 -8 6" stroke="#ffffff" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="56" y="30" width="16" height="10" rx="2" fill="#ffffff"/>
  <rect x="61" y="22" width="6" height="8" rx="1" fill="#ffffff" opacity="0.75"/>
</svg>
