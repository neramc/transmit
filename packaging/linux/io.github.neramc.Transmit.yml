# Flatpak manifest. Works on any distribution, which matters for the ones with
# no Qt 6 packages of their own.
app-id: io.github.neramc.Transmit
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: transmit

finish-args:
  # Transmit reads what the user chose and writes to removable media. It has no
  # business anywhere else, and no business on the network at all.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  # Reading the desktop's own preferences, and the login keyring when the user
  # opts in to carrying passwords.
  - --talk-name=org.freedesktop.secrets
  - --system-talk-name=org.freedesktop.NetworkManager
  - --filesystem=xdg-config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf

modules:
  - name: transmit
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DTRANSMIT_BUILD_TESTS=OFF
      # Flathub updates this, and the sandbox has no network to update from.
      # Built out rather than refused at runtime: the code that could replace
      # a program is not in the build that must never replace one.
      - -DTRANSMIT_WITH_UPDATER=OFF
    sources:
      - type: git
        url: https://github.com/neramc/transmit.git
        tag: v0.1.0
    post-install:
      # Flatpak exports a desktop file and its icons only when they are named
      # after the application id. Installed under their plain names, as every
      # other packaging here wants them, they would sit inside the sandbox
      # where nothing outside it ever sees them - no launcher entry, no icon.
      - mv /app/share/applications/transmit.desktop
        /app/share/applications/io.github.neramc.Transmit.desktop
      - sed -i 's/^Icon=transmit$/Icon=io.github.neramc.Transmit/'
        /app/share/applications/io.github.neramc.Transmit.desktop
      - for dir in /app/share/icons/hicolor/*/apps; do
        mv "$dir/transmit.png" "$dir/io.github.neramc.Transmit.png" 2>/dev/null || true;
        mv "$dir/transmit.svg" "$dir/io.github.neramc.Transmit.svg" 2>/dev/null || true;
        done
